<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbital Destroyer</title>
  <meta name="description" content="Wreck the solar system and watch an n-body simulation work out what happens.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Universe Extrapolater Orbital Destroyer</h1>
    <p>Delete the Sun, smash Earth, send a black hole through. The planets start where they were on
      1 January 2000 and move under Newtonian gravity, worked out in your browser.</p>
  </header>
  <main>
    <section class="view">
      <canvas id="sky" role="img" aria-label="The Sun and planets, seen from above"></canvas>
    </section>
    <aside class="panel" id="panel">
      <section>
        <label>Scenario
          <select id="preset">
            <option value="">Pick one, or wreck it yourself</option>
            <option value="black-hole">A black hole passes 20 AU out</option>
            <option value="earth-smash">A Mars-mass body hits Earth</option>
            <option value="half-sun">The Sun loses half its mass</option>
            <option value="jupiter-star">Jupiter 80 times heavier</option>
            <option value="no-sun">The Sun vanishes</option>
          </select>
        </label>
        <label>or a plan from <code>uxod ask</code> <input id="planfile" type="file" accept=".json,application/json"></label>
        <p id="question"></p>
      </section>
      <section class="clock">
        <button id="play" type="button">Pause</button>
        <label>Speed
          <select id="speed">
            <option value="0.25">3 months a second</option>
            <option value="1">1 year a second</option>
            <option value="2" selected>2 years a second</option>
            <option value="10">10 years a second</option>
            <option value="50">50 years a second</option>
          </select>
        </label>
        <button id="reset" type="button">Start over</button>
        <output id="year">year 0.0</output>
      </section>
      <section>
        <table id="bodies">
          <thead><tr><th>Body</th><th title="distance from the Sun">From Sun</th><th title="semi-major axis">a</th><th title="eccentricity">e</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
      <section>
        <p id="earth" class="num"></p>
        <ol id="events"></ol>
      </section>
      <section class="act">
        <h2>Do something to <span class="needs-body">Earth</span></h2>
        <div class="row"><button type="button" id="remove">Delete it</button></div>
        <form class="row" id="scale">
          <label>Mass &times; <input name="factor" type="number" step="any" min="0" value="10" required></label>
          <button>Change mass</button>
        </form>
        <form class="row" id="kick">
          <label>Push <input name="delta_v_kms" type="number" step="any" value="5" required> km/s</label>
          <select name="direction" class="dirs"></select>
          <button>Push</button>
        </form>
        <form class="row" id="smash">
          <label>Hit with <input name="impactor_mass" type="number" step="any" min="0" value="0.1" required></label>
          <select name="mass_unit"><option value="mearth">Earths</option><option value="mjup">Jupiters</option><option value="msun">Suns</option></select>
          <label>at <input name="speed_kms" type="number" step="any" min="0" value="20" required> km/s</label>
          <select name="direction" class="dirs"></select>
          <button>Smash</button>
        </form>
        <p id="error" class="error" role="alert"></p>
      </section>
      <section>
        <h2>Send something through</h2>
        <form id="flyby">
          <div class="row">
            <label>Name <input name="name" value="Black hole" maxlength="24" required></label>
          </div>
          <div class="row">
            <label>Mass <input name="mass" type="number" step="any" min="0" value="10" required></label>
            <select name="mass_unit"><option value="msun">Suns</option><option value="mjup">Jupiters</option><option value="mearth">Earths</option></select>
          </div>
          <div class="row">
            <label>Closest to the Sun <input name="closest_approach_au" type="number" step="any" min="0" value="20" required> AU</label>
          </div>
          <div class="row">
            <label>Speed <input name="speed_kms" type="number" step="any" min="0" value="50" required> km/s</label>
            <label>from <input name="angle_deg" type="number" step="any" value="120"> &deg;</label>
          </div>
          <div class="row"><button>Send it</button> <output id="arrives"></output></div>
        </form>
      </section>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
