[project]
name = "uxod"
version = "0.1.0"
description = "Universe extrapolater orbital destroyer: an agent that wrecks the solar system and simulates what happens"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["uxod"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["."]
