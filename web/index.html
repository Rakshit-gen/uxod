<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbital Destroyer</title>
  <meta name="description" content="Wreck the solar system and watch an n-body simulation work out what happens.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Universe Extrapolater Orbital Destroyer</h1>
    <p>Delete the Sun, smash Earth, send a black hole through. The planets start where they were on
      1 January 2000 and move under Newtonian gravity, worked out in your browser.</p>
  </header>
  <main>
    <section class="view">
      <canvas id="sky" role="img" aria-label="The Sun and planets, seen from above"></canvas>
    </section>
    <aside class="panel" id="panel">
      <section class="clock">
        <button id="play" type="button">Pause</button>
        <label>Speed
          <select id="speed">
            <option value="0.25">3 months a second</option>
            <option value="1">1 year a second</option>
            <option value="2" selected>2 years a second</option>
            <option value="10">10 years a second</option>
            <option value="50">50 years a second</option>
          </select>
        </label>
        <output id="year">year 0.0</output>
      </section>
      <section>
        <table id="bodies">
          <thead><tr><th>Body</th><th title="distance from the Sun">From Sun</th><th title="semi-major axis">a</th><th title="eccentricity">e</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
